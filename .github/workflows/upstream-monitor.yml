name: Upstream monitor

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-monitor-main
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.inspect.outputs.has_changes }}
      mergeable: ${{ steps.inspect.outputs.mergeable }}
      upstream_sha: ${{ steps.inspect.outputs.upstream_sha }}
      base_sha: ${{ steps.inspect.outputs.base_sha }}
      tests_passed: ${{ steps.test.outputs.tests_passed || steps.runtime_failure.outputs.tests_passed }}
    steps:
      - name: Check out fork base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch verified upstream
        run: |
          git remote add upstream https://github.com/harry0703/MoneyPrinterTurbo.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin main
      - name: Classify incoming changes
        id: inspect
        run: |
          python scripts/upstream_impact.py \
            --base origin/main \
            --upstream upstream/main \
            --markdown "$RUNNER_TEMP/upstream-impact.md" \
            --json "$RUNNER_TEMP/upstream-impact.json"
          python - "$RUNNER_TEMP/upstream-impact.json" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          with pathlib.Path(sys.argv[2]).open('a') as out:
              out.write(f"has_changes={str(data['has_changes']).lower()}\n")
              out.write(f"mergeable={str(data['mergeable']).lower()}\n")
              out.write(f"upstream_sha={data['upstream_sha']}\n")
              out.write(f"base_sha={data['base_sha']}\n")
          PY
      - name: Set up supported Python
        id: setup_python
        if: steps.inspect.outputs.has_changes == 'true' && steps.inspect.outputs.mergeable == 'true'
        continue-on-error: true
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Set up uv
        id: setup_uv
        if: steps.inspect.outputs.has_changes == 'true' && steps.inspect.outputs.mergeable == 'true' && steps.setup_python.outcome == 'success'
        continue-on-error: true
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
      - name: Record runtime setup failure
        id: runtime_failure
        if: steps.inspect.outputs.has_changes == 'true' && steps.inspect.outputs.mergeable == 'true' && (steps.setup_python.outcome != 'success' || steps.setup_uv.outcome != 'success')
        run: |
          printf '\nValidation: Python or uv setup failed; tests were not run. Inspect the workflow step error.\n' >> "$RUNNER_TEMP/upstream-impact.md"
          echo 'tests_passed=false' >> "$GITHUB_OUTPUT"
      - name: Test a clean merge candidate
        id: test
        if: steps.inspect.outputs.has_changes == 'true' && steps.inspect.outputs.mergeable == 'true' && steps.setup_python.outcome == 'success' && steps.setup_uv.outcome == 'success'
        continue-on-error: true
        env:
          BASE_REF: origin/main
          UPSTREAM_REF: upstream/main
        run: |
          tests_passed=true
          report="$RUNNER_TEMP/upstream-impact.md"
          candidate="$RUNNER_TEMP/merge-candidate"
          if ! git worktree add --detach "$candidate" "$BASE_REF"; then
            tests_passed=false
            printf '\nValidation: could not create an isolated merge worktree; tests were not run.\n' >> "$report"
          else
            git -C "$candidate" config user.name "github-actions[bot]"
            git -C "$candidate" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git -C "$candidate" merge --no-commit --no-ff "$UPSTREAM_REF"; then
              tests_passed=false
              printf '\nValidation: merge failed in the review worktree; tests were not run. Human resolution is required.\n' >> "$report"
            else
              cd "$candidate"
              if ! uv sync --locked --group dev; then
                tests_passed=false
                printf '\nValidation: dependency synchronization failed; tests were not run.\n' >> "$report"
              else
                if ! uv run --locked python -X utf8 -m pytest -q test; then
                  tests_passed=false
                  printf '\nValidation: pytest failed for the clean merge candidate.\n' >> "$report"
                fi
                if ! uv run --locked ruff check .; then
                  tests_passed=false
                  printf '\nValidation: Ruff failed for the clean merge candidate.\n' >> "$report"
                fi
              fi
              if [ "$tests_passed" = true ]; then
                printf '\nValidation: clean merge candidate; pytest and Ruff passed in the isolated review job.\n' >> "$report"
              else
                printf '\nValidation: review the CI run before merging.\n' >> "$report"
              fi
            fi
          fi
          printf 'tests_passed=%s\n' "$tests_passed" >> "$GITHUB_OUTPUT"
      - name: Record merge conflict for human review
        if: steps.inspect.outputs.has_changes == 'true' && steps.inspect.outputs.mergeable != 'true'
        run: |
          printf '\nValidation: merge conflict detected; automated tests were not run on a merged candidate. Human resolution and tests are required.\n' >> "$RUNNER_TEMP/upstream-impact.md"
          echo 'tests_passed=false' >> "$GITHUB_OUTPUT"
      - name: Upload impact report
        if: always() && steps.inspect.outputs.has_changes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-impact
          path: ${{ runner.temp }}/upstream-impact.md
          if-no-files-found: error
          retention-days: 14

  prepare-review:
    needs: inspect
    if: needs.inspect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out fork base without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch upstream and report
        env:
          EXPECTED_BASE_SHA: ${{ needs.inspect.outputs.base_sha }}
        run: |
          git remote add upstream https://github.com/harry0703/MoneyPrinterTurbo.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" != "$EXPECTED_BASE_SHA" ]; then
            echo "Fork main changed during review preparation. Refusing to prepare a PR based on an untested tree. Rerun the workflow."
            exit 1
          fi
          python scripts/upstream_impact.py \
            --base origin/main \
            --upstream upstream/main \
            --markdown "$RUNNER_TEMP/upstream-impact.md" \
            --json "$RUNNER_TEMP/upstream-impact.json"
      - name: Create review branch without force-pushing
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.inspect.outputs.upstream_sha }}
          EXPECTED_BASE_SHA: ${{ needs.inspect.outputs.base_sha }}
          MERGEABLE: ${{ needs.inspect.outputs.mergeable }}
        run: |
          short_sha="${UPSTREAM_SHA::12}"
          base_short="${EXPECTED_BASE_SHA::12}"
          branch="codex/upstream-main-${short_sha}-${base_short}"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            valid=true
            if [ "$MERGEABLE" = true ] && ! git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "origin/$branch"; then valid=false; fi
            if ! git merge-base --is-ancestor "$UPSTREAM_SHA" "origin/$branch"; then valid=false; fi
            if [ "$valid" = false ]; then
              echo "Existing branch $branch is not a valid descendant of the current base and upstream. Refusing to rewrite it."
              exit 1
            fi
            git switch --detach "origin/$branch"
          else
            if [ "$MERGEABLE" = true ]; then
              git switch --create "$branch" origin/main
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              if ! git merge --no-commit --no-ff --no-edit "$UPSTREAM_SHA"; then
                git merge --abort
                echo "The prepared merge conflicted despite the earlier merge-tree check. Refusing to publish an untested review branch."
                exit 1
              fi
              git commit -m "Merge upstream MoneyPrinterTurbo main at ${UPSTREAM_SHA::12}"
            else
              git switch --create "$branch" "$UPSTREAM_SHA"
            fi
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
              push origin "HEAD:refs/heads/$branch"
          fi
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
      - name: Download impact report
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: upstream-impact
          path: ${{ runner.temp }}/impact
      - name: Open or update review PR
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ steps.branch.outputs.branch }}
          UPSTREAM_SHA: ${{ needs.inspect.outputs.upstream_sha }}
        run: |
          pr_number="$(gh pr list --base main --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            gh pr create \
              --base main \
              --head "$HEAD_BRANCH" \
              --title "Review upstream MoneyPrinterTurbo changes (${UPSTREAM_SHA::12})" \
              --body-file "$RUNNER_TEMP/impact/upstream-impact.md"
          else
            gh pr edit "$pr_number" --body-file "$RUNNER_TEMP/impact/upstream-impact.md"
            echo "Updated the impact report on the existing review PR. No branch rewrite or automatic merge was attempted."
          fi
